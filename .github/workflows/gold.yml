name: Cập nhật giá vàng và tỷ giá

on:
  schedule:
    # Phút 17 và 47 mỗi giờ, từ 07:17 đến 22:47 giờ Việt Nam (UTC+7).
    # Tránh phút :00 và :30: GitHub hay bỏ hoặc trễ lượt chạy hẹn giờ vào các phút đông người dùng.
    - cron: '17,47 0-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Mỗi nguồn chạy độc lập: một nguồn lỗi thì nguồn kia vẫn cập nhật
      - name: Giá vàng (PNJ)
        run: node scripts/fetch-gold.mjs
        continue-on-error: true
      - name: Tỷ giá (Vietcombank)
        run: node scripts/fetch-fx.mjs
        continue-on-error: true
      - name: Lưu nếu có thay đổi
        run: |
          if [ -n "$(git status --porcelain gold.json fx.json)" ]; then
            git config user.name "gold-bot"
            git config user.email "gold-bot@users.noreply.github.com"
            git add gold.json fx.json
            git commit -m "Cập nhật giá vàng và tỷ giá"
            git push
          fi
